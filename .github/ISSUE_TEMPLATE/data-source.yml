name: Support a new input or tool
description: Suggest a design tool, checker or connector the review should read from
labels: ["data-source"]
body:
  - type: input
    id: source
    attributes:
      label: Tool or service
      placeholder: "e.g. Figma Dev Mode, Storybook, axe, Hotjar, Microsoft Clarity"
    validations:
      required: true
  - type: input
    id: access
    attributes:
      label: How Claude can reach it
      placeholder: "MCP server name/link, API, export file, screenshots"
  - type: textarea
    id: value
    attributes:
      label: What it would add
      description: Which lenses or checks it would make better, and which values to read from it (tokens, contrast, rage clicks...).
